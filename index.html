<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Formulario</title>

 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark bg-gradient">

    <div class="container py-5">

        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <div class="card shadow-lg rounded-4 p-3">

                    <h3 class="text-center mb-4 text-primary fw-bold fw-bold">
                        Formulario de Contacto                      
                    </h3>

                    <form>
                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label fw-semibold
                                ">Nombre</label>
                                <input type="text" class="form-control">
                            </div>
                               
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label fw-semibold
                                ">Correo</label>
                                <input type="email" class="form-control">
                            </div>
                            </div>

                            <textarea class="form-control" rows="5"></textarea>

                            <div class="form-check">
                                <input type="radio" class="form-check-input">
                                <label class="form-check-label fw-semibold">Soltero</label>
                               </div>

                               <select class="form-select">
                                <option>Argentina</option>
                                <option>España</option>
                               </select>

                               <div class="text-center p-1">
                               <div class="form-check">
                                <input type="checkbox" class="form-check-input">
                                <label class="form-check-label fw-semibold">Acepto términos</label>

                                <br>
                                                        
                               <button class="btn btn-success px-5 py-2 fw-bold shadow ">
                                Enviar
                               </button>
                            </div>
                        </div>
                              
                                  

                        </form>
                </div>
            </div> 
        </div> 
    </div>
</body>
</html>
